name: linux

on:
  pull_request:
  push:
  release:
    types: published

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        buildtype: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # SDL3 is not packaged in Ubuntu 22.04, it is built from source
          sudo apt-get install -y libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev \
            libwayland-dev wayland-protocols

      - name: Configure FSStudio
        run: |
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }} -DFSSTUDIO_VENDORED_SDL=ON

      - name: Build FSStudio
        run: |
          cd build
          make

      - name: Pack FSStudio
        run: |
          cd build
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSStudio-${{ matrix.buildtype }}
          path: ./build/FSStudio-*-Linux.tar.*
